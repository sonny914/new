<style>
  :root{
    color-scheme: only light;   /* opt out of forced dark inversion */

    /* ============ semantic tokens — every component inherits these ============ */
    --brand-yellow:#FFC81F; --brand-orange:#F4661B; --brand-black:#100C0A;
    --brand-cream:#FFFDF7; --brand-charcoal:#1E1815;
    --surface-primary:#FFFDF7;      /* cards, sheets */
    --surface-secondary:#FFF7E6;    /* insets, product halo */
    --surface-control:#F6EFE0;      /* unselected controls */
    --text-primary:#100C0A;
    --text-secondary:#5A524C;       /* 7.5:1 on cream, 4.9:1 on yellow */
    --text-muted:#6B615A;           /* 5.9:1 on cream — cream only */
    --text-price:#C94D0C;           /* 4.5:1 — orange that passes on cream */
    --status-open:#1C8F3C;
    --selection-active:#100C0A;
    --selection-inactive:rgba(16,12,10,.055);

    /* ============ radius ============ */
    --r-control:12px; --r-tile:16px; --r-card:22px; --r-feature:28px; --r-pill:999px;

    /* ============ spacing 4·8·12·16·20·24·32·40·48·64 ============ */
    --s5:20px; --s10:40px; --s16:64px;

    /* ---- canvas / surfaces ---- */
    --yellow:var(--brand-yellow); --yellow-deep:#F0B60C;
    --surface:var(--surface-primary); --surface-2:var(--surface-secondary);
    --charcoal:var(--brand-charcoal); --ink:var(--brand-black);
    --orange:var(--brand-orange); --orange-deep:#C94D0C;
    --green:var(--status-open); --cyan:#5EC8DE;
    --muted:var(--text-secondary); --faint:var(--text-muted);
    --hair:rgba(16,12,10,.13);
    /* ---- spacing 4/8/12/16/24/32/48 ---- */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
    /* ---- radius: three steps, pills reserved for controls ---- */
    --r-sm:var(--r-control); --r-md:var(--r-card); --r-lg:var(--r-feature);
    /* ---- elevation: soft and warm, never sticker-stacked ---- */
    --e1:0 1px 2px rgba(90,60,10,.07), 0 6px 16px rgba(90,60,10,.07);
    --e2:0 2px 6px rgba(90,60,10,.10), 0 18px 38px rgba(90,60,10,.14);
    --ease:cubic-bezier(.2,.85,.25,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--yellow)}
  body{color:var(--ink);font-family:"Figtree",system-ui,sans-serif;font-size:16px;
    line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(112px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:var(--r-sm)}
  .status.closed .dot{background:var(--orange-deep)}
  .status.closed #hours{color:var(--orange-deep)}
  .backlink{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:var(--r-pill);background:rgba(16,12,10,.08)}
  .footer a{color:var(--ink);font-weight:700}
  .wrap{max-width:520px;margin:0 auto;padding:0 var(--s6)}

  /* ================= type system ================= */
  .t-display{font-family:"Anton","Arial Narrow",sans-serif;font-weight:400;
    text-transform:uppercase;letter-spacing:.02em;line-height:1.04}
  .t-section{font-size:11.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--text-secondary)}
  .t-meta{font-size:12.5px;color:var(--text-secondary);line-height:1.45}

  /* ================= header ================= */
  header{padding:calc(var(--s8) + env(safe-area-inset-top)) 0 var(--s2);text-align:center}
  .badge{width:120px;height:120px;margin:0 auto;display:block}
  .badge img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .status{margin-top:var(--s4);display:inline-flex;gap:var(--s2);align-items:center;
    font-size:13px;font-weight:600;color:var(--text-secondary)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .status b{font-weight:800;color:var(--text-primary)}

  /* ================= hero: create your own ================= */
  .hero{margin-top:var(--s8);background:var(--charcoal);color:var(--surface);
    border-radius:var(--r-feature);padding:var(--s6);box-shadow:var(--e2);
    display:block;width:100%;text-align:left;transition:transform .16s var(--ease)}
  .hero:active{transform:scale(.988)}
  .hero-eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
    color:#FF7A2E}
  .hero-body{display:flex;gap:var(--s5);align-items:center;margin-top:10px}
  .hero-copy{flex:1;min-width:0}
  .hero-title{font-family:"Anton","Arial Narrow",sans-serif;font-size:32px;line-height:1.0;
    text-transform:uppercase;letter-spacing:.015em}
  .hero-sub{font-size:14px;color:rgba(255,253,247,.80);margin-top:10px;line-height:1.4;
    max-width:22ch}
  .hero-price{margin-top:var(--s4);font-size:13px;font-weight:700;
    color:rgba(255,253,247,.85);display:flex;align-items:baseline;gap:6px}
  .hero-price em{font-style:normal;font-family:"Anton",sans-serif;font-size:22px;
    color:var(--yellow);letter-spacing:.01em;line-height:1}
  .shelf{display:flex;height:8px;border-radius:var(--r-pill);overflow:hidden;
    margin-top:var(--s5)}
  .shelf i{flex:1}
  .hero-cta{margin-top:var(--s5);width:100%;background:var(--orange);color:var(--ink);
    border-radius:var(--r-md);padding:15px;display:flex;align-items:center;
    justify-content:center;gap:var(--s2);
    font-family:"Anton","Arial Narrow",sans-serif;font-size:17px;letter-spacing:.06em;
    text-transform:uppercase;min-height:48px}
  .hero-cta .arw{transition:transform .2s var(--ease)}
  .hero:hover .hero-cta .arw{transform:translateX(4px)}

  /* ================= category rail ================= */
  .railwrap{position:relative;margin-top:var(--s12)}
  .railwrap::after{content:"";position:absolute;right:0;top:0;bottom:0;width:44px;
    background:linear-gradient(to left,var(--yellow),rgba(255,200,31,0));pointer-events:none}
  .rail{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;
    padding:var(--s1) 44px var(--s1) 0;margin:0}
  .rail::-webkit-scrollbar{display:none}
  .rail{scroll-behavior:smooth}
  .chip{flex:0 0 auto;padding:11px 18px;border-radius:var(--r-pill);min-height:44px;
    display:flex;align-items:center;font-weight:700;font-size:14.5px;white-space:nowrap;
    color:var(--text-secondary);background:rgba(16,12,10,.06);
    transition:background .18s var(--ease),color .18s var(--ease),transform .14s var(--ease)}
  .chip[aria-selected="true"]{background:var(--ink);color:var(--surface);font-weight:800}
  .chip:active{transform:scale(.95)}

  /* ================= product list ================= */
  .catblurb{margin:var(--s6) 0 var(--s4)}
  .catblurb .t-section{display:block}
  .item{width:100%;display:flex;align-items:center;gap:var(--s3);text-align:left;
    padding:10px var(--s4) 10px 10px;border-radius:var(--r-card);
    background:var(--surface);margin-bottom:var(--s3);box-shadow:var(--e1);
    min-height:70px;transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
  .item .icopy{flex:1;min-width:0}
  .item:active{transform:scale(.988)}
  @media(hover:hover){.item:hover{box-shadow:var(--e2)}}
  .thumb{flex-shrink:0;display:block}
  .iname{font-weight:800;font-size:16.5px;letter-spacing:-.015em;line-height:1.2;display:block}
  .inote{font-size:12.5px;color:var(--text-secondary);margin-top:3px;line-height:1.36;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .iprice{font-family:"Anton","Arial Narrow",sans-serif;font-size:18px;
    color:var(--text-price);flex-shrink:0;align-self:center;letter-spacing:.01em;
    min-width:56px;text-align:right}   /* shared right edge across every card */

  /* ================= sip card ================= */
  .sip{margin-top:var(--s12);background:var(--surface);border-radius:var(--r-feature);
    padding:var(--s6);box-shadow:var(--e1)}
  .sip-head{display:flex;align-items:baseline;gap:var(--s3)}
  .sip-line{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:var(--s3);
    line-height:1.25}
  .track{height:10px;border-radius:var(--r-pill);background:rgba(16,12,10,.10);
    margin-top:var(--s4);overflow:hidden}
  .fill{height:100%;border-radius:var(--r-pill);background:var(--brand-orange);width:0;
    transition:width 1.1s var(--ease)}
  .sip.earned{background:var(--brand-charcoal);color:var(--surface-primary)}
  .sip.earned .t-section{color:var(--brand-yellow)}
  .sip.earned .track{background:rgba(255,253,247,.18)}
  .sip.earned .fill{background:var(--brand-yellow)}
  .sip.earned .sip-foot{color:rgba(255,253,247,.72)}
  .sip.earned .sip-foot b{color:var(--brand-yellow)}
  .sip-foot{display:flex;margin-top:var(--s3);font-size:13px;color:var(--text-secondary);
    font-weight:600}
  .sip-foot b{margin-left:auto;font-weight:800;color:var(--ink)}

  /* ================= events (editorial, on canvas) ================= */
  .events{margin-top:var(--s12)}
  .ev{display:flex;gap:var(--s4);padding:var(--s4) 0;border-top:1px solid var(--hair)}
  .ev:last-child{border-bottom:1px solid var(--hair)}
  .evdate{width:56px;flex-shrink:0;text-align:center;
    font-family:"Anton","Arial Narrow",sans-serif;text-transform:uppercase;line-height:1}
  .evdate .m{font-size:13px;letter-spacing:.12em;color:var(--orange)}
  .evdate .d{font-size:23px;letter-spacing:.01em;margin-top:3px;display:block}
  .evtitle{font-weight:800;font-size:16px;letter-spacing:-.015em;line-height:1.2}
  .evmeta{font-size:12.5px;color:var(--text-secondary);margin-top:var(--s1);line-height:1.5}

  /* ================= sheet ================= */
  .scrim{position:fixed;inset:0;background:rgba(16,12,10,.48);opacity:0;pointer-events:none;
    transition:opacity .24s var(--ease);z-index:40;backdrop-filter:blur(3px)}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface-primary);
    border-radius:28px 28px 0 0;max-height:93vh;overflow-y:auto;max-width:520px;margin:0 auto;
    transform:translateY(101%);transition:transform .34s var(--ease);
    padding-bottom:calc(var(--s6) + env(safe-area-inset-bottom));
    box-shadow:0 -18px 50px rgba(60,40,10,.28)}
  .sheet.on{transform:translateY(0)}
  .grab{width:44px;height:5px;border-radius:5px;background:rgba(16,12,10,.14);
    margin:var(--s3) auto 0}

  .cupstage{display:flex;justify-content:center;padding:var(--s5) 0 0;position:relative;
    isolation:isolate}
  .cupstage::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
    width:248px;height:190px;border-radius:50%;background:var(--surface-secondary)}
  .liq,.bit{transition:all .48s var(--ease)}
  @keyframes pour{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
  .cupstage svg{animation:pour .4s var(--ease);position:relative;z-index:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .sname{font-family:"Anton","Arial Narrow",sans-serif;font-size:32px;text-align:center;
    margin:var(--s5) auto 6px;line-height:1.03;text-transform:uppercase;
    letter-spacing:.02em;max-width:320px}
  .snote{text-align:center;font-size:14px;color:var(--text-secondary);line-height:1.5;
    max-width:320px;margin:0 auto}
  .soz{text-align:center;font-size:11px;font-weight:800;letter-spacing:.18em;
    text-transform:uppercase;color:var(--text-price);margin-top:10px}

  .grouplabel{font-size:11.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--text-secondary);margin:var(--s6) 0 var(--s3);display:flex;align-items:center;
    gap:var(--s2)}
  .req{color:var(--orange);letter-spacing:.1em}

  .swall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4) var(--s2)}
  .sw{display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding-top:var(--s1)}
  .swdot{width:48px;height:48px;border-radius:50%;
    box-shadow:inset 0 -7px 13px rgba(0,0,0,.17), inset 0 6px 10px rgba(255,255,255,.5);
    transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .18s var(--ease)}
  .sw[aria-pressed="true"] .swdot{transform:scale(1.08);
    box-shadow:inset 0 -7px 13px rgba(0,0,0,.17), inset 0 6px 10px rgba(255,255,255,.5),
      0 0 0 3px var(--surface), 0 0 0 6px var(--ink)}
  .swname{font-size:11px;line-height:1.25;text-align:center;color:var(--text-secondary);
    max-width:78px;font-weight:600}
  .sw[aria-pressed="true"] .swname{color:var(--ink);font-weight:800}

  .pills{display:flex;gap:var(--s2);flex-wrap:wrap}
  .topgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);
    grid-auto-rows:1fr}
  .pill{max-width:100%;padding:12px 15px;border-radius:var(--r-control);background:var(--selection-inactive);
    font-size:14px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;
    gap:var(--s2);min-height:46px;
    transition:background .16s var(--ease),transform .14s var(--ease),box-shadow .16s var(--ease)}
  .pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
  .pill[aria-pressed="true"] .op{color:var(--yellow)}
  .pill:active{transform:scale(.96)}
  /* toppings are controls: compact, checkable, one consistent selected state */
  .pill.top{padding:9px 11px;font-size:12px;text-align:left;justify-content:flex-start;
    gap:8px;min-height:46px;border-radius:var(--r-tile);
    background:var(--surface-control);box-shadow:inset 0 0 0 1.5px transparent}
  .pill.top{min-width:0}
  .pill.top .tn{flex:1;min-width:0;line-height:1.25;font-weight:600}
  .pill.top .op{font-size:11px;flex-shrink:0;margin-left:auto;padding-left:8px}
  .pill.top .pip{width:10px;height:10px}
  .pill.top .chk{width:18px;height:18px;border-radius:6px;flex-shrink:0;position:relative;
    background:rgba(16,12,10,.09);transition:background .16s var(--ease)}
  .pill.top .chk::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:9px;
    border:solid var(--surface);border-width:0 2.2px 2.2px 0;transform:rotate(45deg) scale(.4);
    opacity:0;transition:opacity .14s var(--ease),transform .18s cubic-bezier(.3,1.5,.5,1)}
  .pill.top[aria-pressed="true"]{background:#FFF0D2;color:var(--text-primary);
    box-shadow:inset 0 0 0 1.5px var(--brand-orange)}
  .pill.top[aria-pressed="true"] .chk{background:var(--brand-orange)}
  .pill.top[aria-pressed="true"] .chk::after{opacity:1;transform:rotate(45deg) scale(1)}
  .pill.top[aria-pressed="true"] .op{color:var(--text-price)}
  .pill.top:active{transform:scale(.97)}
  .pip{width:14px;height:14px;border-radius:50%;flex-shrink:0;
    box-shadow:inset 0 -3px 5px rgba(0,0,0,.20), inset 0 2px 4px rgba(255,255,255,.5)}
  .op{font-size:11.5px;font-weight:700;color:var(--text-muted)}

  /* action bar: sticks above the home indicator, price always current */
  .actionbar{position:sticky;bottom:0;margin-top:var(--s6);
    padding:var(--s4) 0 calc(var(--s2) + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--surface-primary) 74%,rgba(255,253,247,0))}
  .btn{width:100%;padding:17px var(--s5);border-radius:var(--r-card);min-height:54px;
    font-family:"Anton","Arial Narrow",sans-serif;font-size:18px;letter-spacing:.05em;
    text-transform:uppercase;display:flex;justify-content:space-between;
    align-items:center;gap:var(--s3);background:var(--ink);color:var(--surface);
    transition:transform .14s var(--ease),background .2s var(--ease)}
  .btn.ok{background:var(--status-open)}
  .sheetclose{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;
    background:var(--selection-inactive);display:grid;place-items:center;font-size:17px;
    line-height:1;color:var(--text-secondary);z-index:2}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{background:rgba(16,12,10,.12);color:rgba(16,12,10,.40);cursor:not-allowed;
    transform:none}
  .btn .amt{color:var(--yellow);margin-left:auto}
  .btn.ghost{background:transparent;color:var(--text-secondary);margin-top:var(--s2);
    font-family:"Figtree",sans-serif;font-weight:700;font-size:14.5px;text-transform:none;
    letter-spacing:0;min-height:44px;padding:12px;justify-content:center}

  /* ================= cart ================= */
  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:var(--s3) var(--s6) calc(var(--s4) + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--yellow) 56%,rgba(255,200,31,0));
    transform:translateY(150%);transition:transform .32s var(--ease)}
  .cartbar.on{transform:translateY(0)}
  .cartinner{max-width:472px;margin:0 auto}
  .cartbtn{width:100%;border-radius:var(--r-md);padding:17px 20px;min-height:58px;
    display:flex;align-items:center;gap:var(--s3);
    font-family:"Anton","Arial Narrow",sans-serif;font-size:18px;text-transform:uppercase;
    letter-spacing:.05em;background:var(--ink);color:var(--surface);box-shadow:var(--e2);
    transition:transform .14s var(--ease)}
  .cartbtn:active{transform:scale(.985)}
  .count{background:var(--orange);color:#fff;font-family:"Anton",sans-serif;font-size:15px;
    min-width:28px;height:28px;border-radius:9px;display:grid;place-items:center;padding:0 7px}
  @keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.28)}}
  .count.bump{animation:bump .42s var(--ease)}
  .cartbtn .total{margin-left:auto;color:var(--yellow)}

  .line{display:flex;gap:var(--s3);align-items:center;padding:var(--s4) 0;
    border-bottom:1px solid var(--hair)}
  .lname{font-weight:800;font-size:15.5px;letter-spacing:-.01em}
  .lmeta{font-size:12.5px;color:var(--text-secondary);margin-top:var(--s1);line-height:1.45}
  .lprice{margin-left:auto;font-family:"Anton","Arial Narrow",sans-serif;font-size:17px;
    color:var(--text-price)}
  .rm{font-size:12px;color:var(--text-secondary);font-weight:700;margin-top:var(--s1);
    text-decoration:underline;padding:var(--s1) 0}
  .totrow{display:flex;padding:var(--s3) 0 0;font-size:13.5px;font-weight:600;color:var(--text-secondary)}
  .totrow.big{font-family:"Anton","Arial Narrow",sans-serif;font-size:25px;color:var(--ink);
    margin-top:var(--s3);padding-top:var(--s4);border-top:1px solid var(--hair);font-weight:400;
    letter-spacing:.01em}
  .totrow span:last-child{margin-left:auto}

  .ticket{background:var(--charcoal);color:var(--surface);border-radius:var(--r-feature);
    padding:var(--s8) var(--s6);margin:var(--s6) 0 var(--s4);text-align:center}
  .tnum{font-family:"Anton","Arial Narrow",sans-serif;font-size:68px;line-height:1;
    color:var(--yellow);margin-top:var(--s2);letter-spacing:.01em}
  .footer{padding:var(--s12) 0 var(--s4);text-align:center;font-size:12.5px;font-weight:600;
    color:var(--faint);line-height:1.9}
  .blank{text-align:center;padding:var(--s10) var(--s5)}
  .blank h3{font-family:"Anton","Arial Narrow",sans-serif;font-size:23px;text-transform:uppercase;
    letter-spacing:.02em;margin:0 0 6px}
  .blank p{font-size:14px;color:var(--text-secondary);margin:0;line-height:1.5}
  .demoflag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);background:rgba(16,12,10,.08);border-radius:var(--r-pill);
    padding:6px 13px;margin-top:var(--s2);font-weight:800}

  /* Chrome on Android auto-darkens pages that don't declare a scheme, which
     turns this whole design black. Declare light, then restate the palette so
     nothing gets repainted even if a browser tries. */
  /* narrow phones: keep the composition, shed only what has to go */
  @media (max-width:359px){
    .wrap{padding:0 var(--s5)}
    .badge{width:100px;height:100px}
    .hero{padding:var(--s5)}
    .hero-title{font-size:27px}
    .hero-body{gap:var(--s3)}
    .herocup svg{width:88px;height:107px}
    .hero-sub{font-size:13px}
    .sname{font-size:27px}
    .swall{grid-template-columns:repeat(3,minmax(0,1fr))}
    .topgrid{grid-template-columns:1fr}
    .item{gap:10px}
    .iname{font-size:15.5px}
    .iprice{font-size:17px;min-width:50px}
  }
  @media (min-width:430px){
    .hero-title{font-size:34px}
  }

  @media (prefers-color-scheme: dark){
    :root{
      --yellow:var(--brand-yellow); --yellow-deep:#F0B60C;
      --surface:var(--surface-primary); --surface-2:var(--surface-secondary);
      --charcoal:var(--brand-charcoal); --ink:var(--brand-black);
      --orange:var(--brand-orange); --orange-deep:#C94D0C; --green:#1C8F3C;
      --muted:rgba(16,12,10,.58); --faint:rgba(16,12,10,.34); --hair:rgba(16,12,10,.13);
    }
    html,body{background:var(--yellow) !important;color:var(--ink) !important}
    .item,.sip,.sheet{background:var(--surface) !important;color:var(--ink) !important}
    .iname,.evtitle,.lname,.sname,.sip-line{color:var(--ink) !important}
    .inote,.snote,.lmeta,.t-section,.grouplabel{color:var(--muted) !important}
    .hero{background:var(--charcoal) !important;color:var(--surface) !important}
    .btn,.cartbtn,.chip[aria-selected="true"],.pill[aria-pressed="true"]{
      background:var(--ink) !important;color:var(--surface) !important}
    .hero-cta{background:var(--orange) !important;color:var(--ink) !important}
    .iprice,.lprice{color:var(--orange) !important}
  }
  @media (forced-colors: active){
    .hero,.btn,.cartbtn,.item{border:2px solid currentColor}
  }
</style>
</head>
<body>

<header>
  <a class="backlink" href="../">&larr; Snack &amp; Sip</a>
  <div class="badge" id="badge"></div>
  <div class="status">
    <span class="dot"></span><b id="hours"></b><span id="tagline"></span>
  </div>
</header>

<main class="wrap">
  <div id="hero"></div>

  <div class="railwrap">
    <div class="rail" id="rail" role="tablist" aria-label="Menu categories"></div>
  </div>
  <div id="menu"></div>

  <div id="sip"></div>
  <div id="events"></div>

  <div class="footer">
    <div id="addr"></div>
    <span class="demoflag">Demo · orders are not sent to the shop yet</span>
  </div>
</main>

<div class="cartbar" id="cartbar">
  <div class="cartinner">
    <button class="cartbtn" id="cartbtn">
      <span class="count" id="cartCount">0</span>
      <span>View order</span>
      <span class="total" id="cartTotal">$0.00</span>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Order details">
  <div class="grab"></div>
  <button class="sheetclose" id="sheetclose" aria-label="Close">&#10005;</button>
  <div class="wrap" id="sheetBody"></div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const money = n => "$" + n.toFixed(2);
  const T = CONFIG.theme, L = CONFIG.loyalty;
  let uid = 0;

  Object.entries(T).forEach(([k,v]) => document.documentElement.style.setProperty("--"+k,v));
  document.querySelector('meta[name=theme-color]').content = T.yellow;
  (function(){
    const H = CONFIG.shop.schedule, fmt = h => h>12?`${h-12} PM`:h===12?'12 PM':`${h} AM`;
    let txt = "Hours", open = false;
    try{
      const parts = new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'short',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());
      const g = t => parts.find(p=>p.type===t).value;
      const d = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')), now = (+g('hour')%24)+(+g('minute'))/60, t = H[d];
      if(t && now>=t[0] && now<t[1]){ open = true; txt = "Open till " + fmt(t[1]); }
      else if(t && now<t[0]){ txt = "Opens " + fmt(t[0]) + " today"; }
      else { let n=(d+1)%7,i=0; while(!H[n]&&i<7){n=(n+1)%7;i++} txt = "Closed · opens " + fmt(H[n][0]); }
    }catch(e){}
    $("#hours").textContent = txt;
    document.querySelector(".status").classList.toggle("closed", !open);
    $("#tagline").textContent = "· " + CONFIG.shop.hours;
  })();
  $("#addr").innerHTML = `<a href="${CONFIG.shop.maps}" target="_blank" rel="noopener">${CONFIG.shop.street}</a><br>${CONFIG.shop.address} · next to Great American Cookies`;
  
  /* ---------- placeholder mark: lemon badge (swap for logo.png in CONFIG) ---------- */
  function lemonBadge(){
    return `<svg viewBox="0 0 100 100" width="74" height="74" aria-hidden="true">
      <circle cx="50" cy="50" r="49" fill="#080605"/>
      <circle cx="50" cy="50" r="46" fill="none" stroke="${T.orange}" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="41" fill="none" stroke="${T.orange}" stroke-width="1" opacity=".4"/>
      <!-- leaf -->
      <path d="M60,24 Q76,10 88,16 Q82,33 63,32 Z" fill="${T.lime}"/>
      <path d="M63,31 Q74,22 86,17" stroke="#4F8B26" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- lemon body: rounded with a nub bottom-left, tilted -->
      <g transform="rotate(-8 50 56)">
        <path d="M50,29 C69,29 80,41 80,56 C80,71 69,82 50,82
                 C33,82 20,72 20,57 C20,49 23,42 28,37
                 C25,35 24,32 26,31 C28,30 31,32 32,35
                 C37,31 43,29 50,29 Z" fill="${T.yellow}"/>
        <path d="M50,29 C69,29 80,41 80,56 C80,71 69,82 50,82
                 C33,82 20,72 20,57 C20,49 23,42 28,37
                 C25,35 24,32 26,31 C28,30 31,32 32,35
                 C37,31 43,29 50,29 Z" fill="url(#lg)"/>
      </g>
      <!-- shades -->
      <path d="M25,50 L77,47 L78,58 Q78,61 74,61 L54,62 Q51,62 50,59 L49,59 Q48,62 45,62 L27,63 Q24,63 24,60 Z" fill="#0A0705"/>
      <path d="M28,51.5 L46,50.5 L46.5,58.5 L28.5,59.5 Z" fill="#2E2622"/>
      <path d="M54,50 L74,49 L74.5,57 L54.5,58 Z" fill="#2E2622"/>
      <path d="M30,52.5 L37,52 L37.5,55 L30.5,55.5 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M56,51 L61,50.7 L61.4,53.4 L56.4,53.7 Z" fill="rgba(255,255,255,.35)"/>
      <!-- grin -->
      <path d="M37,67 Q51,79 64,65 Q51,71 37,67 Z" fill="#7A1F12"/>
      <path d="M38,67.5 Q51,71 63,66" stroke="#FFF6E9" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <!-- sparkles -->
      <path d="M85,44 l1.7,4.6 4.6,1.7 -4.6,1.7 -1.7,4.6 -1.7,-4.6 -4.6,-1.7 4.6,-1.7 Z" fill="${T.yellow}"/>
      <path d="M14,40 l1.2,3.2 3.2,1.2 -3.2,1.2 -1.2,3.2 -1.2,-3.2 -3.2,-1.2 3.2,-1.2 Z" fill="${T.orange}"/>
      <defs><linearGradient id="lg" x1="0" y1="0" x2=".7" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
        <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#C7530C" stop-opacity=".35"/>
      </linearGradient></defs>
    </svg>`;
  }
  $("#badge").innerHTML = CONFIG.shop.logo
    ? `<a href="../" aria-label="Snack & Sip home"><img src="${CONFIG.shop.logo}" alt="${CONFIG.shop.name}" width="120" height="120"></a>` : lemonBadge();

  const need = L.punchesToReward - L.demoPunches;
  $("#sip").innerHTML = `
    <div class="sip${need <= 0 ? " earned" : ""}">
      <div class="sip-head"><span class="t-section">${need <= 0 ? "Reward ready" : "Sip Card"}</span></div>
      <div class="sip-line">${need <= 0
        ? "Your " + L.rewardLabel.toLowerCase() + " is ready."
        : need + " more sip" + (need>1?"s":"") + ". This one's on us."}</div>
      <div class="track"><div class="fill" id="sipfill"></div></div>
      <div class="sip-foot"><span>${L.rewardLabel}</span>
        <b>${L.demoPunches} of ${L.punchesToReward}</b></div>
    </div>`;
  requestAnimationFrame(()=>{ const f=$("#sipfill");
    if(f) f.style.width = Math.min(100, L.demoPunches/L.punchesToReward*100) + "%"; });

  /* ================= the drink renderer — one function, two sizes ================= */
  function drinkSVG(o){
    const id = "u" + (++uid);
    const cols = (o.colors && o.colors.length ? o.colors : ["#FF7A18"]);
    const w = o.w, h = o.h, hero = o.hero;
    const bits = o.bits || [], rim = o.rim, foam = o.foam, lid = o.lid;

    // soft-blended liquid: stops overlap so colors melt into each other
    const n = cols.length;
    const stops = n === 1
      ? `<stop offset="0" stop-color="${cols[0]}"/><stop offset="1" stop-color="${cols[0]}"/>`
      : cols.map((c,i) => {
          // anchor each color at its band centre so neighbours melt together
          const mid = i === 0 ? 0 : (i === n-1 ? 1 : (i + 0.5) / n);
          return `<stop offset="${mid.toFixed(3)}" stop-color="${c}"/>`;
        }).join("");

    if(o.cone){
      return `<svg viewBox="0 0 100 128" width="${w}" height="${h}" aria-hidden="true">
        <defs>
          <linearGradient id="l${id}" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient>
          <linearGradient id="g${id}" x1=".15" y1="0" x2=".8" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
        </defs>
        <path d="M22,58 A30,30 0 0 1 78,58 Z" fill="url(#l${id})"/>
        <path d="M22,58 A30,30 0 0 1 78,58 Z" fill="url(#g${id})"/>
        <path d="M22,58 L50,118 L78,58 Z" fill="#F7F1E4"/>
        <path d="M32,58 L50,116" stroke="rgba(0,0,0,.10)" stroke-width="2"/>
        <path d="M68,58 L50,116" stroke="rgba(0,0,0,.10)" stroke-width="2"/>
        <path d="M22,58 L50,118 L78,58" fill="none" stroke="${T.ink}"
              stroke-width="${hero?3:2.6}" stroke-linejoin="round" opacity=".88"/>
        <path d="M22,58 A30,30 0 0 1 78,58" fill="none" stroke="${T.ink}"
              stroke-width="${hero?3:2.6}" opacity=".88"/>
        ${o.brand ? sticker(id, 78, hero ? 15 : 14) : ""}
        ${bits.map((b,i)=>[[-14,44],[2,38],[16,47],[-3,50]].map(([dx,dy])=>
          `<circle class="bit" cx="${50+dx}" cy="${dy+i*3}" r="${hero?2.6:2}" fill="${b}"/>`).join("")).join("")}
      </svg>`;
    }

    // cup: rounded, tapered, glassy
    const body = "M20,34 L80,34 L71,110 Q70,118 62,118 L38,118 Q30,118 29,110 Z";
    return `<svg viewBox="0 0 100 ${lid||o.straw?128:126}" width="${w}" height="${h}" aria-hidden="true">
      <defs>
        <clipPath id="c${id}"><path d="${body}"/></clipPath>
        <linearGradient id="l${id}" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient>
        <linearGradient id="g${id}" x1=".1" y1="0" x2=".75" y2=".9">
          <stop offset="0" stop-color="#fff" stop-opacity=".46"/>
          <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
      </defs>
      <g clip-path="url(#c${id})">
        <rect x="0" y="0" width="100" height="128" fill="rgba(26,21,18,.05)"/>
        <rect class="liq" x="0" y="${foam?44:38}" width="100" height="90" fill="url(#l${id})"/>
        ${foam ? `<rect class="liq" x="0" y="34" width="100" height="13" fill="#FFF3E0"/>
                  <ellipse cx="50" cy="47" rx="34" ry="5" fill="#FFF3E0"/>` : ""}
        ${bits.map((b,i)=>[[-19,100],[-6,108],[8,102],[19,110],[-12,113],[3,94],[15,116]]
          .map(([dx,dy])=>`<circle class="bit" cx="${50+dx}" cy="${dy-i*4}" r="${hero?2.9:2.2}" fill="${b}"/>`).join("")).join("")}
        ${[[30,58,15],[57,74,-12],[38,92,22],[62,102,6]].map(([x,y,r])=>
          `<rect x="${x}" y="${y}" width="15" height="15" rx="4"
             transform="rotate(${r} ${x+7} ${y+7})"
             fill="rgba(255,255,255,.20)" stroke="rgba(255,255,255,.16)" stroke-width="1"/>`).join("")}
        <rect x="0" y="0" width="100" height="128" fill="url(#g${id})"/>
        <path d="M33,44 Q29,80 35,110" stroke="rgba(255,255,255,.55)" stroke-width="${hero?4.5:3}"
              fill="none" stroke-linecap="round"/>
      </g>
      ${o.brand ? sticker(id, 82, hero ? 22 : 20) : ""}
      <path d="${body}" fill="none" stroke="${T.ink}" stroke-width="${hero?3:2.6}"
            stroke-linejoin="round" opacity=".88"/>
      ${rim ? `<path d="M20,34 L80,34 L78.4,45 L21.6,45 Z" fill="${T.orange}"/>
               ${[26,33,40,47,54,61,68,75].map((x,i)=>
                 `<circle cx="${x}" cy="${38+(i%2)*3.5}" r="1.4" fill="${T.yellow}"/>`).join("")}` : ""}
      ${o.straw ? `<path d="M63,${lid?20:30} L74,${lid?2:5}" stroke="#6FAF35" stroke-width="${hero?7.5:5.5}"
                    stroke-linecap="round"/>
                   <path d="M63,${lid?20:30} L74,${lid?2:5}" stroke="${T.lime}" stroke-width="${hero?5:3.6}"
                    stroke-linecap="round"/>` : ""}
      ${lid
        ? `<path d="M17,34 Q17,13 50,13 Q83,13 83,34 Z" fill="#EAF4F8" opacity=".9"/>
           <path d="M17,34 Q17,13 50,13 Q83,13 83,34" fill="none"
                 stroke="${T.ink}" stroke-width="${hero?3:2.6}" opacity=".88" stroke-linecap="round"/>
           <path d="M28,30 Q29,19 42,16" stroke="#fff" stroke-width="3"
                 fill="none" stroke-linecap="round"/>
           <rect x="13" y="29" width="74" height="9" rx="4.5" fill="#F4FAFC"
                 stroke="${T.ink}" stroke-width="${hero?3:2.6}" opacity=".95"/>`
        : `<rect x="15" y="28" width="70" height="9" rx="4.5" fill="#F7F1E4"
                 stroke="${T.ink}" stroke-width="${hero?3:2.6}" opacity=".88"/>`}
    </svg>`;
  }

  // Their cups all wear the sticker. Put it on the drink, not just the header.
  function sticker(id, cy, r){
    if(!CONFIG.shop.logo) return "";
    return `<g>
      <circle cx="50" cy="${cy}" r="${r}" fill="#FFFDF7"/>
      <clipPath id="s${id}"><circle cx="50" cy="${cy}" r="${r-2.5}"/></clipPath>
      <image href="${CONFIG.shop.logo}" x="${50-(r-2.5)}" y="${cy-(r-2.5)}"
             width="${(r-2.5)*2}" height="${(r-2.5)*2}"
             clip-path="url(#s${id})" preserveAspectRatio="xMidYMid slice"/>
    </g>`;
  }

  function optionsFor(ch){
    return (ch.items || CONFIG[ch.src] || []).map(o => typeof o === "string" ? {name:o} : o);
  }

  const feature = CONFIG.menu.find(i => i.cat === "byo");
  if(feature){
    $("#hero").innerHTML = `
      <button class="hero" data-id="${feature.id}">
        <div class="hero-eyebrow">Made to order</div>
        <div class="hero-body">
          <div class="hero-copy">
            <div class="hero-title">${feature.name}</div>
            <div class="hero-sub">Any base. Up to 3 syrups. Cream on top.</div>
            <div class="hero-price">From<em>${money(feature.price)}</em></div>
          </div>
          <span class="herocup">${drinkSVG({colors:feature.colors,w:112,h:136,straw:true,brand:true})}</span>
        </div>
        <div class="shelf">${CONFIG.syrups.map(sy=>
          `<i style="background:${sy.color}"></i>`).join("")}</div>
        <div class="hero-cta"><span>Build yours</span><span class="arw">&rarr;</span></div>
      </button>`;
    $("#hero").addEventListener("click", e => {
      const b = e.target.closest("[data-id]"); if(!b) return;
      openItem(CONFIG.menu.find(i => i.id === b.dataset.id));
    });
  }

  let cat = CONFIG.categories[0].id, cart = [], draft = null;

  $("#rail").innerHTML = CONFIG.categories.map(c =>
    `<button class="chip" role="tab" data-cat="${c.id}" aria-selected="${c.id===cat}">${c.label}</button>`).join("");

  function renderMenu(){
    const c = CONFIG.categories.find(x => x.id === cat);
    const items = CONFIG.menu.filter(i => i.cat === cat);
    $("#menu").innerHTML =
      `<div class="catblurb"><span class="t-section">${c.blurb}</span></div>` +
      items.map(i => `
        <button class="item" data-id="${i.id}" aria-label="${i.name}, ${money(i.price)}">
          <span class="thumb">${drinkSVG({colors:i.colors,w:58,h:70,cone:i.cone,
            lid:i.lid,rim:i.rim,straw:!i.cone,brand:true})}</span>
          <span class="icopy">
            <span class="iname">${i.name}</span>
            <span class="inote">${i.note}</span>
          </span>
          <span class="iprice">${money(i.price)}</span>
        </button>`).join("");
  }
  renderMenu();

  $("#rail").addEventListener("click", e => {
    const b = e.target.closest("[data-cat]"); if(!b) return;
    cat = b.dataset.cat;
    document.querySelectorAll("#rail .chip").forEach(c =>
      c.setAttribute("aria-selected", c.dataset.cat === cat));
    b.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
    renderMenu();
  });
  $("#menu").addEventListener("click", e => {
    const b = e.target.closest("[data-id]"); if(!b) return;
    openItem(CONFIG.menu.find(i => i.id === b.dataset.id));
  });

  function openSheet(html){
    $("#sheetBody").innerHTML = html;
    $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
    document.body.style.overflow = "hidden"; $("#sheet").scrollTop = 0;
  }
  function closeSheet(){
    $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on");
    document.body.style.overflow = ""; draft = null;
  }
  $("#scrim").addEventListener("click", closeSheet);
  $("#sheetclose").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

  function drinkColors(){
    const it = draft.item, out = [];
    (it.choices||[]).forEach(ch => {
      const s = draft.sel[ch.key];
      (Array.isArray(s) ? s : (s ? [s] : [])).forEach(n => {
        const o = optionsFor(ch).find(x => x.name === n);
        if(o && o.color) out.push(o.color);
      });
    });
    return out.length ? out : (it.colors || ["#FF7A18"]);
  }
  function tops(){ return [...draft.tops].map(n => CONFIG.toppings.find(t => t.name === n)); }
  function heroSVG(){
    const it = draft.item, t = tops();
    return drinkSVG({
      colors: drinkColors(), w:176, h:218, hero:true, brand:true,
      cone:it.cone, lid:it.lid, straw:!it.cone,
      rim: it.rim || t.some(x=>x.rim), foam: t.some(x=>x.foam),
      bits: t.filter(x=>x.bits).map(x=>x.bits)
    });
  }

  function openItem(item){
    draft = { item, sel:{}, tops:new Set() };
    (item.choices||[]).forEach(ch => { draft.sel[ch.key] = ch.type === "multi" ? [] : null; });
    renderItemSheet();
  }
  function draftPrice(){
    let p = draft.item.price;
    (draft.item.choices||[]).forEach(ch => {
      const s = draft.sel[ch.key];
      (Array.isArray(s) ? s : (s ? [s] : [])).forEach((n, idx) => {
        const o = optionsFor(ch).find(x => x.name === n) || {};
        if(typeof o.price === "number") p += o.price;
        else if(ch.type === "multi"){ if(idx >= (ch.free ?? 0)) p += (ch.extra ?? 0); }
        else if(ch.price) p += ch.price;
      });
    });
    draft.tops.forEach(n => p += CONFIG.toppings.find(t => t.name === n).price);
    return p;
  }
  function unmet(){
    return (draft.item.choices||[]).filter(ch => {
      if(!ch.required) return false;
      const s = draft.sel[ch.key];
      return Array.isArray(s) ? !s.length : !s;
    });
  }
  function addLabel(){
    const b = unmet();
    return b.length ? `<span>Pick ${b.map(x=>x.label.toLowerCase()).join(" and ")}</span>`
      : `<span>Add to order</span><span class="amt">${money(draftPrice())}</span>`;
  }

  function renderItemSheet(){
    const it = draft.item;
    const groups = (it.choices||[]).map((ch, gi) => {
      const opts = optionsFor(ch), s = draft.sel[ch.key];
      const on = n => Array.isArray(s) ? s.includes(n) : s === n;
      const cap = ch.type === "multi" && ch.max ? ` · up to ${ch.max}` : "";
      const head = `<div class="grouplabel">${ch.label}${cap}
        ${ch.required?'<span class="req">required</span>':''}</div>`;
      // colored options render as a swatch wall; plain text as pills
      const colored = ch.style === "wall";
      const body = colored
        ? `<div class="swall">${opts.map(o=>`
            <button class="sw" data-g="${gi}" data-v="${o.name}" aria-pressed="${on(o.name)}">
              <span class="swdot" style="background:${o.color}"></span>
              <span class="swname">${o.name}</span></button>`).join("")}</div>`
        : `<div class="pills">${opts.map(o=>`
            <button class="pill" data-g="${gi}" data-v="${o.name}" aria-pressed="${on(o.name)}">
              ${o.color?`<span class="pip" style="background:${o.color}"></span>`:""}
              <span>${o.name}</span>
              ${o.price?`<span class="op">+${money(o.price)}</span>`:""}</button>`).join("")}</div>`;
      return head + body;
    }).join("");

    openSheet(`
      <div class="cupstage" id="cupstage">${heroSVG()}</div>
      <div class="sname">${it.name}</div>
      <div class="snote">${it.note}</div>
      ${it.oz?`<div class="soz">${it.oz}</div>`:""}
      ${groups}
      <div class="grouplabel">Top it off</div>
      <div class="topgrid">${CONFIG.toppings.map(t=>`
        <button class="pill top" data-top="${t.name}" aria-pressed="${draft.tops.has(t.name)}">
          <span class="chk"></span>
          <span class="pip" style="background:${t.bits||"#FFF3E0"}"></span>
          <span class="tn">${t.name}</span><span class="op">+${money(t.price)}</span></button>`).join("")}</div>
      <div class="actionbar">
        <button class="btn" id="add" ${unmet().length?"disabled":""}>${addLabel()}</button>
      </div>
    `);
  }
  function refresh(){
    const st = $("#cupstage"); if(st) st.innerHTML = heroSVG();
    const b = $("#add"); b.disabled = unmet().length > 0; b.innerHTML = addLabel();
  }

  $("#sheet").addEventListener("click", e => {
    const t = e.target;
    const g = t.closest("[data-g]");
    if(g){
      const ch = draft.item.choices[+g.dataset.g], v = g.dataset.v;
      if(ch.type === "multi"){
        const a = draft.sel[ch.key], i = a.indexOf(v);
        if(i > -1) a.splice(i,1);
        else if(!ch.max || a.length < ch.max) a.push(v);
      } else draft.sel[ch.key] = draft.sel[ch.key] === v ? null : v;
      $("#sheet").querySelectorAll(`[data-g="${g.dataset.g}"]`).forEach(b=>{
        const s = draft.sel[ch.key];
        b.setAttribute("aria-pressed", Array.isArray(s) ? s.includes(b.dataset.v) : s === b.dataset.v);
      });
      refresh(); return;
    }
    const tp = t.closest("[data-top]");
    if(tp){
      const n = tp.dataset.top;
      draft.tops.has(n) ? draft.tops.delete(n) : draft.tops.add(n);
      tp.setAttribute("aria-pressed", draft.tops.has(n));
      refresh(); return;
    }
    if(t.closest("#add") && !$("#add").disabled){
      const b = $("#add");
      b.classList.add("ok"); b.innerHTML = "<span>Added &#10003;</span>"; b.disabled = true;
      const d = draft;
      setTimeout(()=>{ draft = d; commit(); }, 340);
      return; }
    if(t.closest("#cancel")||t.closest("#keepgoing")){ closeSheet(); return; }
    if(t.closest("#checkout")){ checkout(); return; }
    if(t.closest("#done")){ cart=[]; syncCart(); closeSheet(); return; }
    const rm = t.closest("[data-rm]");
    if(rm){ cart.splice(+rm.dataset.rm,1); syncCart(); cart.length?renderCart():closeSheet(); }
  });

  function commit(){
    const it = draft.item, parts = [], tl = tops();
    (it.choices||[]).forEach(ch => {
      const s = draft.sel[ch.key];
      const list = Array.isArray(s) ? s : (s ? [s] : []);
      if(list.length) parts.push(list.join(", "));
    });
    tl.forEach(t => parts.push(t.name));
    cart.push({ name:it.name, oz:it.oz||"", price:draftPrice(), meta:parts.join(" · "),
      art: drinkSVG({colors:drinkColors(), w:44, h:54, cone:it.cone, lid:it.lid, straw:!it.cone,
        rim:it.rim||tl.some(x=>x.rim), foam:tl.some(x=>x.foam), bits:tl.filter(x=>x.bits).map(x=>x.bits)}) });
    syncCart(true); closeSheet();
  }
  function syncCart(bump){
    const n = cart.length, tot = cart.reduce((s,l)=>s+l.price,0);
    if(bump){ const c = $("#cartCount"); c.classList.remove("bump");
      void c.offsetWidth; c.classList.add("bump"); }
    $("#cartCount").textContent = n;
    $("#cartTotal").textContent = money(tot);
    $("#cartbar").classList.toggle("on", n > 0);
  }
  $("#cartbtn").addEventListener("click", renderCart);

  function renderCart(){
    if(!cart.length){
      openSheet(`<div class="blank">
        <h3>Nothing in here yet</h3>
        <p>Pick something cold. We'll hold it at the counter.</p>
      </div>
      <div class="actionbar"><button class="btn" id="keepgoing">Back to menu</button></div>`);
      return;
    }
    const sub = cart.reduce((s,l)=>s+l.price,0), tax = sub*0.0825, tot = sub+tax;
    openSheet(`
      <div class="sname" style="margin-top:18px">Your order</div>
      <div class="snote">${CONFIG.shop.name} · ${CONFIG.shop.address}</div>
      <div style="height:14px"></div>
      ${cart.map((l,i)=>`
        <div class="line">
          <span style="flex-shrink:0">${l.art}</span>
          <div>
            <div class="lname">${l.name}${l.oz?` <span style="color:var(--dimmer);font-family:'Space Mono',monospace;font-size:10.5px;font-weight:400">${l.oz}</span>`:""}</div>
            <div class="lmeta">${l.meta||"—"}</div>
            <button class="rm" data-rm="${i}">Remove</button>
          </div>
          <div class="lprice">${money(l.price)}</div>
        </div>`).join("")}
      <div class="totrow"><span>Subtotal</span><span>${money(sub)}</span></div>
      <div class="totrow"><span>Tax</span><span>${money(tax)}</span></div>
      <div class="totrow big"><span>Total</span><span>${money(tot)}</span></div>
      <div class="actionbar">
        <button class="btn" id="checkout"><span>Pay and pick up</span><span class="amt">${money(tot)}</span></button>
        <button class="btn ghost" id="keepgoing">Add something else</button>
      </div>
    `);
  }
  function checkout(){
    const num = 100 + Math.floor(Math.random()*800);
    const p = Math.min(L.punchesToReward, L.demoPunches + cart.length);
    openSheet(`
      <div style="text-align:center;padding:26px 0 0">
        <div class="sname" style="font-size:32px">Order in</div>
        <div class="snote">We'll call your number at the counter.</div>
      </div>
      <div class="ticket">
        <div class="pl">Pickup number</div>
        <div class="tnum">${num}</div>
        <div style="margin-top:16px;font-size:13px;line-height:1.6;color:var(--dim)">
          ${cart.length} item${cart.length>1?"s":""} · show this number at the counter<br>${CONFIG.shop.address}
        </div>
      </div>
      <div class="punchcard">
        <div><div class="pl">Sip Card</div>
        <div class="pr">+${cart.length} punch${cart.length>1?"es":""} added</div></div>
        <div class="punches">${Array.from({length:L.punchesToReward},(_,i)=>
          `<div class="punch ${i<p?"on":""}"></div>`).join("")}</div>
      </div>
      <button class="btn" id="done">Back to menu</button>
      <div class="footer"><span class="demoflag">Demo · no payment was taken and the shop has not received this</span></div>
    `);
  }
  // events board — hidden entirely when the array is empty
  const ev = CONFIG.events || [];
  $("#events").innerHTML = ev.length ? `
    <div class="events">
      <div class="t-section" style="margin-bottom:var(--s4)">Catch us out</div>
      ${ev.map(e=>{
        const p = e.when.split(" · ")[1] || e.when;      // "Jul 4–5"
        const m = p.split(" ")[0] || "";
        const d = p.split(" ").slice(1).join(" ");
        return `<div class="ev">
          <div class="evdate"><span class="m">${m}</span><span class="d">${d}</span></div>
          <div>
            <div class="evtitle">${e.title}</div>
            <div class="evmeta">${e.time}<br>${e.where}</div>
          </div>
        </div>`;}).join("")}
    </div>` : "";

  syncCart();
})();
</script>
</body>
</html>
