<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Top 5 plugins for Claude — carousel compositor</title>
<link href="https://fonts.googleapis.com/css2?family=Hubot+Sans:wdth,wght@75..125,200..900&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:675px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script type="module">
/* "Top 5 plugins for Claude" as a seven-slide 4:5 carousel with light motion. ?slide=1..7 picks the slide.
   Every slide is fully set on its first frame (a feed shows that frame before anything plays); the motion is a loop
   on top of it: each plugin's own Thinking orb turns, and the orange live outline steps through the four cards.
   Slide 1 is the cover, drawn over downloads/claude-plugins/cover-photo.jpg when that file exists.
   window.reel.draw(n) paints frame n deterministically; tools/reel/plugins-render.mjs renders every slide. */
import { makePainter, normalizeProps } from '/assets/orb/thinking-orb.js';
import { paintFrame } from '/assets/orb/engine.js';

const W = 1080, H = 1350, FPS = 30, DURATION = 8, SLIDES = 7;
const CREAM = '#F2EEE5', QUIET = '#968D7C', LIVE = '#FF5A00', HAIR = 'rgba(242,238,229,.18)', CARD = 'rgba(242,238,229,.035)';
const SLIDE = Math.min(SLIDES, Math.max(1, Number(new URLSearchParams(location.search).get('slide')) || 1));
const c = document.getElementById('c'), ctx = c.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (k) => (k >= 1 ? 1 : 1 - 2 ** (-10 * k));
const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2);

// ---------- the copy. Claims are written to what each project or Anthropic says, and marked where they are only that.
const PLUGINS = [
  { name: 'OmniRoute', orb: 'connecting', line: 'One endpoint, many models.',
    cards: [['Local gateway', 'One OpenAI-style endpoint, running on your machine.'], ['Falls back', 'Routes to another provider when you hit a limit.'],
            ['Stacks free tiers', 'Across providers. Real capacity varies.'], ['Read the fine print', 'Some pools are unofficial. Check its security notes.']],
    note: 'Community project. Not affiliated with Anthropic.' },
  { name: 'Superpowers', orb: 'weaving', line: 'A process, not just a prompt.',
    cards: [['Asks questions', 'Until the spec is actually clear.'], ['Writes a plan', 'Small enough steps to follow.'],
            ['Subagents build', 'Task by task, checking each other.'], ['Reviews the work', 'Before you ever see the output.']],
    note: 'Open source, by Jesse Vincent (obra).' },
  { name: 'Caveman', orb: 'shaping', line: 'Why use many token when few do trick.',
    cards: [['Open source', 'A Claude Code plugin on GitHub.'], ['Terse replies', 'Cuts output tokens, not your input.'],
            ['~65% fewer, claimed', 'The project’s own benchmark. Test yours.'], ['Same code', 'It shortens the talk, not the code.']],
    note: 'Savings are self-reported. Independent tests found less.' },
  { name: 'Claude Code Setup', orb: 'searching', line: 'Anthropic’s own setup scanner.',
    cards: [['Reads your codebase', 'Your stack, your structure, your context.'], ['Recommends hooks', 'For the work you keep repeating.'],
            ['Suggests skills', 'For what you’re actually building.'], ['Subagents and MCP', 'It recommends. You choose.']],
    note: 'In Anthropic’s official plugin marketplace.' },
  { name: 'Claude Security', orb: 'solving', line: 'Find it before someone else does.',
    cards: [['Scans the repo', 'Or just a branch, a PR, a commit.'], ['Rates every finding', 'Severity and confidence, so you triage.'],
            ['Suggests patches', 'Worked in a throwaway copy of the repo.'], ['Nothing auto-applied', 'You review. You approve.']],
    note: 'Anthropic. In beta, Enterprise first.' },
];

// ---------- orbs, from the real engine
const painters = new Map();
function orb(state, x, y, d, et, color = CREAM) {
  const key = state + color;
  if (!painters.has(key)) painters.set(key, makePainter(normalizeProps({ state, size: 64, zoom: 10, color, dots: 1.4, dotSize: 1.6 })));
  const p = painters.get(key);
  ctx.save(); ctx.translate(x - d / 2, y - d / 2); ctx.scale(d / p.px, d / p.px);
  paintFrame(ctx, p.frame(et * p.effSpeed + 3), true, { r: parseInt(color.slice(1, 3), 16), g: parseInt(color.slice(3, 5), 16), b: parseInt(color.slice(5, 7), 16) });
  ctx.restore();
}
/** An orb that loops on the reel's length: the last half second crossfades into the first frame. */
function loopOrb(state, x, y, d, t, color) {
  const k = seg(t, DURATION - 0.6, DURATION);
  ctx.save(); ctx.globalAlpha = 1 - k; orb(state, x, y, d, t, color); ctx.restore();
  if (k > 0) { ctx.save(); ctx.globalAlpha = k; orb(state, x, y, d, t - DURATION, color); ctx.restore(); }
}

// ---------- type
const SANS = (wght, px, stretch = 'condensed') => `${wght} ${stretch} ${px}px "Hubot Sans"`;
const SERIF = (px) => `italic 400 ${px}px "Instrument Serif"`;
function text(s, x, y, font, color = CREAM, align = 'left', track = 0) {
  ctx.save(); ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.letterSpacing = `${track}px`; ctx.fillText(s, x, y); ctx.restore();
}
function wrap(s, maxW) {
  const out = []; let line = '';
  for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  return line ? [...out, line] : out;
}
/** The biggest condensed heavy size (up to `max`) at which `s` fits `maxW`. */
function fit(s, maxW, max) { ctx.font = SANS(900, 100); ctx.letterSpacing = `${-2}px`; return Math.min(max, (100 * maxW) / ctx.measureText(s).width); }

// ---------- chrome: lockup, slide counter, a hairline filled to this slide
function chrome() {
  ctx.drawImage(BRAND.mark, 84, 46, 40, 32); ctx.drawImage(BRAND.word, 84 + 40 + 14, 50, 131, 24);
  text(`${String(SLIDE).padStart(2, '0')} / ${String(SLIDES).padStart(2, '0')}`, W - 84, 74, SANS(500, 26, 'expanded'), QUIET, 'right', 4);
  ctx.fillStyle = HAIR; ctx.fillRect(84, 104, W - 168, 2);
  ctx.fillStyle = LIVE; ctx.fillRect(84, 104, (W - 168) * (SLIDE / SLIDES), 2);
}
function grain(n) {
  ctx.save(); ctx.globalAlpha = 0.05; ctx.fillStyle = CREAM;
  let s = (n % 4) * 9301 + 49297;   // grain repeats every four frames, so the loop has no seam
  for (let i = 0; i < 1300; i++) { s = (s * 9301 + 49297) % 233280; const x = (s / 233280) * W; s = (s * 9301 + 49297) % 233280; const y = (s / 233280) * H; ctx.fillRect(x, y, 2, 2); }
  ctx.restore();
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- slide 1: the cover
function cover(t) {
  if (BRAND.photo) {
    // a slow breathe in and out over the loop, so the last frame meets the first
    const z = 1.04 + 0.03 * (0.5 - 0.5 * Math.cos((2 * Math.PI * t) / DURATION));
    // full width and dropped, so the blindfold sits clear under the title, not behind it
    const ph = BRAND.photo, s = (W / ph.width) * z, top = 330;
    ctx.drawImage(ph, (W - ph.width * s) / 2, top - (ph.height * s - ph.height * (W / ph.width)) / 2, ph.width * s, ph.height * s);
    const g = ctx.createLinearGradient(0, top, 0, top + 240); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, top); ctx.fillStyle = g; ctx.fillRect(0, top, W, 240);
    // the QB mark glowing on the right-hand monitor, as if it were on screen
    ctx.save(); ctx.globalAlpha = 0.6; ctx.globalCompositeOperation = 'screen';
    ctx.translate(W / 2, top); ctx.scale(z, z); ctx.translate(-W / 2, -top);
    ctx.drawImage(BRAND.mark, 936, top + 572, 84, 67); ctx.restore();
    const b = ctx.createLinearGradient(0, H * 0.75, 0, H); b.addColorStop(0, 'rgba(0,0,0,0)'); b.addColorStop(1, 'rgba(0,0,0,.7)');
    ctx.fillStyle = b; ctx.fillRect(0, 0, W, H);
  } else {
    // until the photo exists: the five plugin orbs in a ring, turning
    PLUGINS.forEach((p, i) => { const a = -Math.PI / 2 + (i / 5) * Math.PI * 2 + (t / DURATION) * Math.PI * 0.4; loopOrb(p.orb, W / 2 + Math.cos(a) * 300, 930 + Math.sin(a) * 200, 190, t + i, i === 0 ? LIVE : CREAM); });
  }
  text('TOP 5', W / 2, 330, SANS(900, 210), CREAM, 'center', -4);
  text('PLUGINS', W / 2, 520, SANS(900, 210), LIVE, 'center', -4);
  text('FOR CLAUDE', W / 2, 590, SANS(600, 40, 'expanded'), CREAM, 'center', 16);
  // the swipe pill, with an arrow that nudges
  ctx.save(); ctx.font = SANS(600, 30, 'normal'); const label = 'Swipe to see all five', lw = ctx.measureText(label).width;
  const pw = lw + 120, px = W / 2 - pw / 2, py = H - 150;
  ctx.fillStyle = CREAM; ctx.beginPath(); ctx.roundRect(px, py, pw, 72, 36); ctx.fill();
  ctx.fillStyle = '#000'; ctx.fillText(label, px + 36, py + 46);
  const nx = 10 * Math.max(0, Math.sin((2 * Math.PI * t) / 2)) ** 3;
  ctx.strokeStyle = LIVE; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const ax = px + pw - 70 + nx, ay = py + 36;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + 30, ay); ctx.moveTo(ax + 18, ay - 12); ctx.lineTo(ax + 30, ay); ctx.lineTo(ax + 18, ay + 12); ctx.stroke();
  ctx.restore();
}

// ---------- slides 2-6: one plugin each
function plugin(t, i) {
  const p = PLUGINS[i];
  loopOrb(p.orb, W / 2, 330, 380, t, CREAM);
  text(`PLUGIN ${String(i + 1).padStart(2, '0')}`, W / 2, 590, SANS(500, 28, 'expanded'), QUIET, 'center', 8);
  text(p.name.toUpperCase(), W / 2, 712, SANS(900, fit(p.name.toUpperCase(), W - 168, 150)), CREAM, 'center', -2);
  text(p.line, W / 2, 784, SERIF(52), CREAM, 'center');
  // four cards; the orange live outline steps through them, two seconds each
  const live = Math.floor((t / DURATION) * 4) % 4, cw = (W - 168 - 24) / 2, ch = 196;
  p.cards.forEach(([head, sub], j) => {
    const x = 84 + (j % 2) * (cw + 24), y = 840 + Math.floor(j / 2) * (ch + 24), on = j === live;
    const local = (t - live * (DURATION / 4)) / 0.35, glow = on ? outExpo(clamp(local)) : 0;
    ctx.save();
    ctx.fillStyle = CARD; ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 10); ctx.fill();
    ctx.strokeStyle = HAIR; ctx.lineWidth = 2; ctx.stroke();
    if (glow > 0) { ctx.strokeStyle = LIVE; ctx.globalAlpha = glow; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.restore();
    text(String(j + 1).padStart(2, '0'), x + 28, y + 52, SANS(600, 26, 'expanded'), on ? LIVE : QUIET, 'left', 4);
    ctx.font = SANS(800, 40, 'normal'); ctx.letterSpacing = '0px';
    text(head, x + 28, y + 104, SANS(800, Math.min(40, (40 * (cw - 56)) / ctx.measureText(head).width), 'normal'), CREAM);
    ctx.font = SANS(400, 27, 'normal');
    wrap(sub, cw - 56).slice(0, 2).forEach((l, k) => text(l, x + 28, y + 146 + k * 34, SANS(400, 27, 'normal'), QUIET));
  });
  text(p.note, W / 2, 1312, SANS(400, 24, 'normal'), QUIET, 'center');
}

// ---------- slide 7: the studio's line
function close(t) {
  loopOrb('breathing', W / 2, 300, 300, t, LIVE);
  text('BEFORE YOU INSTALL ONE,', W / 2, 560, SANS(900, fit('BEFORE YOU INSTALL ONE,', W - 168, 120)), CREAM, 'center', -2);
  text('TRY TO KILL IT.', W / 2, 690, SANS(900, fit('BEFORE YOU INSTALL ONE,', W - 168, 120)), LIVE, 'center', -2);
  const qs = [['Who made it?', 'And who still maintains it?'], ['What can it touch?', 'Your code, your keys, your network.'], ['What does it save you?', 'On your repo, not in the README.']];
  const live = Math.floor((t / DURATION) * 3) % 3;
  qs.forEach(([q, a], j) => {
    const y = 790 + j * 130, on = j === live;
    ctx.fillStyle = HAIR; ctx.fillRect(84, y, W - 168, 2);
    if (on) { ctx.fillStyle = LIVE; ctx.fillRect(84, y, (W - 168) * outExpo(clamp((t - live * (DURATION / 3)) / 0.6)), 2); }
    text(String(j + 1).padStart(2, '0'), 84, y + 70, SANS(600, 26, 'expanded'), on ? LIVE : QUIET, 'left', 4);
    text(q, 170, y + 62, SANS(800, 44, 'normal'), CREAM);
    text(a, 170, y + 106, SERIF(36), QUIET);
  });
  ctx.fillStyle = HAIR; ctx.fillRect(84, 1180, W - 168, 2);
  text('Save this for your next build.', W / 2, 1272, SANS(700, 34, 'normal'), CREAM, 'center');
}

function draw(n) {
  const t = n / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (SLIDE === 1) cover(t); else if (SLIDE === 7) close(t); else plugin(t, SLIDE - 2);
  if (SLIDE !== 1 || !BRAND.photo) vignette();
  chrome();
  grain(n);
}

async function cream(url) {
  const svg = (await (await fetch(url)).text()).replace(/fill="#000000"/g, `fill="${CREAM}"`);
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await img.decode(); return img;
}
async function photo(url) { try { const img = new Image(); img.src = url; await img.decode(); return img; } catch { return null; } }
const BRAND = { mark: await cream('/assets/brand/mark.svg'), word: await cream('/assets/brand/wordmark.svg'), photo: SLIDE === 1 ? await photo('/downloads/claude-plugins/cover-photo.jpg') : null };
await document.fonts.load('900 100px "Hubot Sans"'); await document.fonts.load('italic 400 100px "Instrument Serif"'); await document.fonts.ready;
window.reel = { draw, W, H, FPS, DURATION, SLIDES, frames: DURATION * FPS, hasPhoto: !!BRAND.photo };
window.reel.ready = true;
if (!navigator.webdriver) { let n = 0; const tick = () => { draw(n); n = (n + 1) % (DURATION * FPS); requestAnimationFrame(tick); }; tick(); }
</script>
</body>
</html>
