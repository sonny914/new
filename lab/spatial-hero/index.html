<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#000000" />
<title>Quiet Bands</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hubot+Sans:wdth,wght@75..125,200..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/lab/hero.css" />
<script>document.documentElement.classList.add(window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'rm' : 'js');</script>
</head>
<body>

<main>
  <section class="track" id="track" aria-label="Quiet Bands">
    <div class="stage" id="stage">
      <div class="volume" id="volume" tabindex="0" role="img" aria-label="Quiet Bands. Custom software, Houston, Texas. A documented process reads Request to Complete; between them, seen from an angle, are the steps it actually takes: email, spreadsheet, handoff, wait, exception, rework. Software built around the work.">

        <div class="coat world" data-depth="300" aria-hidden="true"><div class="spec"></div></div>

        <div class="bands world" data-depth="80" data-base=".7" aria-hidden="true">Bands</div>
        <div class="qshadow world" data-depth="80" data-base=".82" aria-hidden="true">Quiet</div>
        <h1 class="quiet world" data-depth="180">Quiet</h1>

        <div class="line world" data-depth="0" data-base=".85" aria-hidden="true"><span>Request</span><i></i><span>Complete</span></div>

        <div class="slats" aria-hidden="true">
          <div class="slat world" data-depth="-70" style="--t:.22;--i:0">Email</div>
          <div class="slat world" data-depth="-140" style="--t:.31;--i:1">Spreadsheet</div>
          <div class="slat world" data-depth="-210" style="--t:.40;--i:2">Handoff</div>
          <div class="slat world" data-depth="-280" style="--t:.48;--i:3">Wait</div>
          <div class="slat world" data-depth="-350" style="--t:.56;--i:4">Exception</div>
          <div class="slat world" data-depth="-420" style="--t:.65;--i:5">Rework</div>
        </div>

        <p class="where world" data-depth="-40" data-base=".45">Custom software, Houston, Texas.</p>

        <div class="final world" data-depth="-1100" data-arrive="1100">
          <p class="res">Software built<br>around the work.</p>
          <a class="cta" href="/pressure-test">Start with a Pressure Test</a>
        </div>

      </div>
    </div>
  </section>
</main>

<script type="module" src="/assets/lab/hero.js"></script>
</body>
</html>
