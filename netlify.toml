[build]
  command = "echo 'Static site, no build needed'"
  publish = "."

  [build.environment]
    NODE_VERSION = "20"
    # The Supabase project URL and publishable (anon) key are public by design:
    # they ship in the browser so the discovery form can POST leads, and access is
    # controlled by RLS (anon INSERT only; reads require authentication).
    # They are also stored as Netlify env vars for the server-side function, which
    # makes the secrets scanner flag them in HTML. Omit that one key from scanning
    # rather than disabling the scanner — real secrets (service key, API keys,
    # Square tokens) stay covered.
    SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://jkilmecbhjepltbianof.supabase.co https://api.anthropic.com; object-src 'none'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"


# Lab experiments stay out of the index, except the public orb playground (/lab/thinking-orb/).
# Netlify merges every matching rule, so a broad /lab/* noindex cannot be overridden per page: list each private path.
# A new lab page is indexable unless it is added here (and given its own robots meta).
[[headers]]
  for = "/lab/spatial-hero/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/lab/secure-plate/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/lab/spatial-dossier/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/lab/story-home.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/lab/rd-field-guide.html"
  [headers.values]
    X-Robots-Tag = "noindex"


[[headers]]
  for = "/lab/story-home"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/lab/rd-field-guide"
  [headers.values]
    X-Robots-Tag = "noindex"
